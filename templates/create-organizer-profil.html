<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veranstalter Profil erstellen</title>
    <!-- Einbindung der CSS-Datei -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Einbindung der scrpit.js Datei zum Anzeigen der Profilbilder im Create vorgang -->
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>
    {% include '_header.html' %}
    <main class="container">
        <div class="card profile-form">
            <h1>Veranstalter Profil erstellen</h1>
            <p class="lead">Bitte fülle die Details zu deiner Organisation aus.</p>

            <form action="/submit_organizer" method="POST" enctype="multipart/form-data" style="margin-top: 32px;">

                <!-- Profilbild -->
                <fieldset class="form-section">
                    <legend>Profilbild</legend>
                    <div class="upload-box">
                        <div class="upload-avatar" id="profilePicture-preview"></div>
                        <div>
                            <p>Profilbild hinzufügen</p>
                            <p class="help-text">JPG oder PNG · quadratisches Format empfohlen</p>
                            <label class="help-text" for="profilePicture">Datei auswählen</label>
                            <input
                                class="file-input"
                                id="profilePicture"
                                name="profilePicture"
                                type="file"
                                accept="image/jpeg,image/png"
                                data-preview="profilePicture-preview"
                            >
                        </div>
                    </div>
                </fieldset>

                <!-- Organisations Name -->
                <fieldset class="form-section">
                    <legend>Organisation</legend>
                    <div class="field">
                        <label for="companyName">Organisationsname / Firmenname *</label>
                        <input type="text" id="companyName" name="companyName" placeholder="z. B. RDF Nürnberg" class="input" required>
                    </div>
                </fieldset>

                <!-- Ansprechperson -->
                <fieldset class="form-section">
                    <legend>Ansprechpartner</legend>
                    <div class="form-row">
                        <div class="field">
                            <label for="firstName">Vorname *</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Vorname" class="input" required>
                        </div>

                        <div class="field">
                            <label for="lastName">Nachname *</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Nachname" class="input" required>
                        </div>
                    </div>
                </fieldset>

                <!-- Online-Präsenz -->
                <fieldset class="form-section">
                    <legend class="section-heading">Online-Präsenz</legend>
                    <div class="field">
                        <label for="organizer-www">Website</label>
                        <input type="url" id="organizer-www" name="organizer-www" placeholder="https://www.beispiel.de" class="input">
                    </div>

                    <div class="field">
                        <label for="instagram">Instagram</label>
                        <input type="text" id="instagram" name="instagram" placeholder="instagram.com/..." class="input">
                    </div>

                    <div id="additionalPlatforms">
                        <div class="field">
                            <label for="other-sc">Weitere Plattform</label>
                            <input type="url" id="other-sc" name="other-sc" placeholder="Link hinzufügen" class="input">
                        </div>
                    </div>

                    <!-- Formular-Aktionen -->
                    <menu class="form-actions" style="padding: 0;">
                        <button type="submit" class="btn">Profil erstellen</button>
                    </menu>

            </form>
        </div>
    </main>

    <script>
        const addPlatformBtn = document.getElementById('addPlatformBtn');
        if (addPlatformBtn) {
            addPlatformBtn.addEventListener('click', function () {
                console.log("Hier würde JavaScript per DOM-Manipulation ein weiteres URL-Input-Feld einfügen.");
            });
        }

        const imageInput = document.getElementById('profilePicture');
        const imagePreview = document.getElementById('profilePicture-preview');
        let previewUrl;

        imageInput.addEventListener('change', function (event) {
            const file = event.target.files[0];

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            if (file) {
                previewUrl = URL.createObjectURL(file);
                imagePreview.style.backgroundImage = `url(${previewUrl})`;
                imagePreview.style.backgroundSize = 'cover';
                imagePreview.style.backgroundPosition = 'center';
            } else {
                imagePreview.style.backgroundImage = '';
            }
        });
    </script>
</body>
</html>
